name: Update Journal Metrics

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch:     # Allows you to trigger it manually anytime from GitHub

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run citation collector script
        run: python collector.py

      - name: Commit and push updated metrics.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add metrics.json
          git diff --staged --quiet || git commit -m "Automated daily metrics update [skip ci]"
          git push